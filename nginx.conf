server {
    listen 80;
    server_name advitumhealthcare.com www.advitumhealthcare.com;

    # Reverse proxy to Node.js application running on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve frontend static files directly via Nginx for better performance
    location /public/ {
        alias /var/www/advitum/Frontend/public/; # Replace with your HOSTINGER_DEPLOY_PATH
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Optional: Enable client max body size for uploads
    client_max_body_size 20M;
}
