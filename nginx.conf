server {
    listen 80;
    listen [::]:80;
    server_name advitumhealthcare.com www.advitumhealthcare.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name advitumhealthcare.com www.advitumhealthcare.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/advitumhealthcare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/advitumhealthcare.com/privkey.pem;

    client_max_body_size 20M;

    # 1. Uploaded items from Backend/public/uploads
    location /uploads/ {
        alias /var/www/advitum/Backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @node;
    }

    # 2. Legacy /public/ path support
    location /public/ {
        alias /var/www/advitum/Frontend/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @node;
    }

    # 3. Direct static assets from Frontend/public (.png, .jpg, .svg, .css, .js, .pdf, etc.)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|svg|webp|woff|woff2|ttf|eot)$ {
        root /var/www/advitum/Frontend/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri /public$uri @node;
    }

    # 4. Fallback reverse proxy to Node.js app
    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Application reverse proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
