name: Configure Nginx on Hostinger

on:
  workflow_run:
    workflows: ["Deploy to Hostinger"]
    types:
      - completed

jobs:
  nginx-setup:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Update Nginx Config via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            # Install Nginx if not installed
            if ! command -v nginx &> /dev/null; then
              echo "Installing Nginx..."
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            # Check if deploy path exists
            if [ ! -d "${{ secrets.HOSTINGER_DEPLOY_PATH }}" ]; then
              echo "Creating deployment directory..."
              mkdir -p "${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            fi

            cd "${{ secrets.HOSTINGER_DEPLOY_PATH }}"

            # Check if nginx.conf exists
            if [ -f "nginx.conf" ]; then
              sudo cp nginx.conf /etc/nginx/sites-available/advitum
            else
              echo "Error: nginx.conf not found. Listing files in directory:"
              ls -la
              exit 1
            fi
            
            # Enable config if not already enabled (handles symlinks properly)
            if [ ! -L "/etc/nginx/sites-enabled/advitum" ] && [ ! -f "/etc/nginx/sites-enabled/advitum" ]; then
              sudo ln -s /etc/nginx/sites-available/advitum /etc/nginx/sites-enabled/
            fi

            # Test Nginx and reload/restart
            sudo nginx -t && (sudo systemctl reload nginx || sudo systemctl restart nginx)
