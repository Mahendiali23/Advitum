name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: ENV_FILE
          script: |
            # Load NVM and node environment if installed via NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:$HOME/.bin:$HOME/.local/bin

            # Ensure deployment directory exists and change into it
            mkdir -p "${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            cd "${{ secrets.HOSTINGER_DEPLOY_PATH }}" || exit 1
            
            # Check if directory is a git repository; if not, initialize it
            if [ ! -d ".git" ]; then
              echo "Initializing repository..."
              git init
              git remote add origin https://github.com/Mahendiali23/Advitum.git
            fi

            git fetch --all
            git reset --hard origin/main
            if command -v git-lfs &> /dev/null; then
              git lfs pull
            fi
            mkdir -p Backend/public/uploads
            chmod -R 755 Backend/public/uploads Frontend/public
            echo "$ENV_FILE" > Backend/.env
            npm install --production
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2 globally..."
              npm install -g pm2
            fi

            pm2 flush advitum
            
            pm2 restart all || pm2 start Backend/server.js --name "advitum"
